<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">

        <div class="header">
            <div>
                <p class="small-title">MY DAILY PLANNER</p>
                <h1>To-Do List</h1>
                <p class="subtitle">Stay organized. Get things done.</p>
            </div>

            <div class="task-count">
                <span id="taskCount">0</span>
                <small>Tasks</small>
            </div>
        </div>

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
            >

            <input
                type="datetime-local"
                id="taskDate"
            >

            <button id="addTaskBtn">
                + Add Task
            </button>

        </div>

        <div class="task-section">

            <div class="section-title">
                <span>My Tasks</span>
                <span id="completedCount">0 completed</span>
            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage">
                No tasks yet. Add something you need to remember.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
